name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 scripts/scan-secrets.py
      - run: npm ci --ignore-scripts
      - run: npm run check:publication
      - run: npm run build
      - run: npm run test:care:build
      - run: npm run typecheck:api
      - run: npm run test:api:esm
      - run: npm run typecheck:server
      - run: npm run test:server:esm
      - run: npm run test:valuation
      - run: npm run test:ci
      - run: npm audit --audit-level=high

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280 # 18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rattery_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: rattery_ci_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:persistence
      - run: npm run test:simulation:shared
      - run: npm run test:trades:ledger
